# Gera a animação da cobrinha comendo o gráfico de contribuições
# e publica tudo na branch "output". Assim a branch main não recebe commits automáticos.
name: Generate profile graphics

on:
  schedule:
    - cron: "0 */12 * * *"   # a cada 12 horas
  workflow_dispatch:          # permite rodar manualmente pela aba Actions
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Cards de estatísticas, linguagens e projetos, gerados aqui mesmo
      # (o servidor público github-readme-stats vive estourando o limite da API)
      - name: Generate stats cards
        run: |
          python3 .github/scripts/cards.py "${{ github.repository_owner }}" dist \
            orbitron \
            Analise-de-Emissoes-de-Gases-no-Brasil \
            BidUp \
            algoritmo-de-ordenacao
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#7aa2f7

      # Substitui a branch "output" por um único commit, sem acumular histórico
      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
