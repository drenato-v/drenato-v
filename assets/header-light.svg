    .float { animation: fl 6s ease-in-out infinite; }
    @keyframes fl { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-8px) } }
    .shoot { animation: sh 7s linear infinite; opacity: 0; }
    @keyframes sh { 0% { transform: translate(0,0); opacity: 0 } 2% { opacity: 1 } 14% { transform: translate(-420px,210px); opacity: 0 } 100% { transform: translate(-420px,210px); opacity: 0 } }
    .fade1 { animation: in 1.2s ease-out both; }
    .fade2 { animation: in 1.2s ease-out .4s both; }
    .fade3 { animation: in 1.2s ease-out .8s both; }
    @keyframes in { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: translateY(0) } }
    .cur { animation: bl 1s steps(1) infinite; }
    @keyframes bl { 50% { opacity: 0 } }
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
